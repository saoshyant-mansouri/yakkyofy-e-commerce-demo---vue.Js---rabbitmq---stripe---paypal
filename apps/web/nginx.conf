server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security headers on the HTML-serving origin itself — the real fix for
    # the missing-CSP finding on the equivalent real-world app.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-TJc3QibryFcmfvyLo1CjsxL9Fr4hm/rpMtyyfjfaCjo=' https://js.stripe.com https://www.paypal.com https://www.paypalobjects.com; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' __API_ORIGIN__ https://api.stripe.com https://*.paypal.com https://*.mangopay.com; frame-src https://js.stripe.com https://www.paypal.com; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
