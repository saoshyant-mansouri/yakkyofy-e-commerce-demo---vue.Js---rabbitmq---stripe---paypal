    <script type="application/ld+json">
      {

        "name": "Yakkyofy Demo",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",

    <!-- Allowed by the CSP via its sha256 hash (vercel.json, nginx.conf). Any edit to this
         script, even whitespace, changes the hash: update both CSPs, or it will be blocked. -->
    <script>
      // Sets data-theme before first paint so there's no flash of the wrong
      // theme. Mirrors the read logic in store/modules/ui.js exactly.
      (function () {
        var KEY = 'yakkyofy-demo-theme';
        try {
          var stored = localStorage.getItem(KEY);
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
